services:
  relay:
    build: .
    image: ghcr.io/youruser/spotify-lyrics-relay:latest
    container_name: spotify-lyrics-relay
    restart: unless-stopped
    # Only loopback traffic reaches port 8899 — nothing forwarded to the router.
    # TLS terminated by whatever reverse proxy exposes the relay publicly.
    ports:
      - "127.0.0.1:8899:8899"
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - RELAY_ADDR=:8899
      - RELAY_BASE_PATH=${RELAY_BASE_PATH:-/lyrics}
      - STATE_DIR=/data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8899/lyrics/"]
      interval: 30s
      timeout: 5s
      retries: 3
