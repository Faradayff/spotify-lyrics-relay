services:
  relay:
    build: .
    image: spotify-lyrics-relay:latest
    container_name: spotify-lyrics-relay
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:?SPOTIFY_CLIENT_ID not set in .env}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:?SPOTIFY_CLIENT_SECRET not set in .env}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:8899/callback}
      - RELAY_ADDR=${RELAY_ADDR:-:8899}
      - STATE_DIR=/data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8899/"]
      interval: 30s
      timeout: 5s
      retries: 3
